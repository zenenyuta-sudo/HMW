*{box-sizing:border-box;font-family:Speda,sans-serif!important}
:root{--bg:#0a1a33;--card:#12284a;--ac:#22d3ee;--tx:#e6f3ff;--mu:#8fb0d3;--g1:#071225;--g2:#0a1a33;--g3:#0d2a4d;--nav:#081428;--in:#0b2040;--bd:#1e4a7a;--btn:linear-gradient(90deg,#06b6d4,#2563eb);--onc:#062}
body{margin:0;background:linear-gradient(160deg,var(--g1),var(--g2) 60%,var(--g3));color:var(--tx);min-height:100vh}
body{display:flex;flex-direction:row}
nav{width:210px;padding:16px;background:var(--nav);display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
nav h1{font-size:17px;color:var(--ac);margin:0 0 4px}nav small{color:var(--mu);margin-bottom:10px}
nav button{background:none;border:0;color:var(--tx);text-align:inherit;padding:10px;border-radius:12px;font-size:15px;cursor:pointer}
nav button.on,nav button:hover{background:var(--btn);color:#fff}
main{flex:1;padding:20px;max-width:900px;animation:f .4s}@keyframes f{from{opacity:0;transform:translateY(8px)}}
.card{background:var(--card);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 6px 20px #0006}

ain go down your leg?", "ئایا ئێشەکە دێتە خوارەوە بۆ قاچت؟", "هل ينتقل الألم إلى ساقك؟"], ["Patient", "No, only in the back.", "نەخێر، تەنها لە پشتمە.", "لا، في الظهر فقط."], ["Doctor", "Rest for two days, take painkillers, and then start physiotherapy.", "دوو ڕۆژ پشوو بدە، دژەئێش بخۆ، پاشان فیزیۆتێراپی دەست پێبکە.", "ارتح لمدة يومين وتناول مسكنات ثم ابدأ العلاج الطبيعي."]], "vocab": ["back pain", "physiotherapy", "spine"], "tip": "«Does the pain go down your leg?» — پرسیارێکە بۆ دەماری سیاتیک.", "tEn": "Back Pain", "tAr": "ألم الظهر", "tipAr": "«Does the pain go down your leg?» سؤال عن عرق النسا."}, {"title": "بەردی گورچیلە", "lines": [["Patient", "I have a sharp pain in my side and it goes to my groin.", "ئێشێکی تیژم هەیە لە تەنیشتم و دەچێتە ناوقەد.", "لدي ألم حاد في جنبي ينتقل إلى أسفل البطن."], ["Doctor", "Have you seen any blood in your urine?", "ئایا خوێنت لە میزەکەتدا بینیوە؟", "هل رأيت دماً في بولك؟"], ["Patient", "Yes, this morning.", "بەڵێ، ئەمڕۆ بەیانی.", "نعم، هذا الصباح."], ["Doctor", "We will do an ultrasound and a urine test.", "سۆنار و پشکنینی میز دەکەین.", "سنجري فحص موجات فوق صوتية وتحليل بول."], ["Doctor", "Drink plenty of water. Most small stones pass by themselves.", "ئاوی زۆر بخۆرەوە. زۆربەی بەردە بچووکەکان خۆیان دەردەچن.", "اشرب الكثير من الماء. معظم الحصى الصغيرة تخرج من تلقاء نفسها."]], "vocab": ["kidney stone", "haematuria", "dysuria"], "tip": "«A sharp pain in the side» — نیشانەی باوی بەردی گورچیلەیە.", "tEn": "Kidney Stone", "tAr": "حصى الكلى", "tipAr": "«A sharp pain in the side» عَرَض شائع لحصى الكلى."}, {"title": "گەڕانی ناو نەخۆشخانە", "lines": [["Professor", "Please present the patient in bed three.", "تکایە نەخۆشی جێگای سێ پێشکەش بکە.", "من فضلك اعرض مريض السرير الثالث."], ["Student", "He is a sixty-year-old man with chest pain and shortness of breath.", "پیاوێکی شەست ساڵانە ئێشی سنگ و تەنگەنەفەسی هەیە.", "رجل في الستين من عمره يعاني من ألم في الصدر وضيق في التنفس."], ["Professor", "What is your diagnosis?", "دەستنیشانکردنەکەت چییە؟", "ما هو تشخيصك؟"], ["Student", "Possibly heart failure. The ECG and chest X-ray support it.", "لەوانەیە لاوازی دڵ بێت. ئێکەجی و وێنەی تیشکی سنگ پشتگیری دەکەن.", "ربما فشل القلب. تخطيط القلب وأشعة الصدر يدعمان ذلك."], ["Professor", "Good. Now tell us your plan.", "باشە. ئێستا پلانەکەمان پێ بڵێ.", "جيد. الآن أخبرنا بخطتك."]], "vocab": ["patient", "diagnosis", "prognosis"], "tip": "«Present the case» — واتە کەیسەکە پێشکەش بکە.", "tEn": "Ward Round", "tAr": "جولة الأقسام", "tipAr": "«Present the case» أي اعرض الحالة."}, {"title": "پسپۆڕی خۆراک", "lines": [["Dietitian", "What do you usually eat in a day?", "بە شێوەی ئاسایی لە ڕۆژێکدا چی دەخۆیت؟", "ماذا تأكل عادةً في اليوم؟"], ["Patient", "Mostly bread and rice, and sweets in the evening.", "زۆرتر نان و برنج، و شیرینی لە ئێواراندا.", "معظمه خبز وأرز، وحلويات في المساء."], ["Dietitian", "You need a balanced diet with more vegetables and protein.", "پێویستت بە ڕێژیمێکی هاوسەنگە بە سەوزە و پڕۆتینی زیاترەوە.", "تحتاج إلى نظام غذائي متوازن مع مزيد من الخضروات والبروتين."], ["Patient", "Can I still eat sweets?", "هێشتا دەتوانم شیرینی بخۆم؟", "هل يمكنني أن آكل الحلويات؟"], ["Dietitian", "Only a small amount once a week.", "تەنها بڕێکی کەم هەفتەی جارێک.", "كمية صغيرة فقط مرة في الأسبوع."]], "vocab": ["protein", "obesity", "malnutrition"], "tip": "«Balanced diet» — واتە ڕێژیمی هاوسەنگ.", "tEn": "Dietitian Visit", "tAr": "زيارة أخصائي التغذية", "tipAr": "«Balanced diet» أي نظام غذائي متوازن."}, {"title": "وازهێنان لە جگەرەکێشان", "lines": [["Doctor", "How many cigarettes do you smoke a day?", "ڕۆژانە چەند جگەرە دەکێشیت؟", "كم سيجارة تدخن في اليوم؟"], ["Patient", "About twenty, and I have a morning cough.", "نزیکەی بیست، و کۆکەی بەیانیانم هەیە.", "نحو عشرين، ولدي سعال صباحي."], ["Doctor", "Smoking damages your lungs and increases the risk of cancer.", "جگەرەکێشان سییەکانت تێکدەدات و مەترسی شێرپەنجە زیاد دەکات.", "التدخين يضر رئتيك ويزيد خطر السرطان."], ["Patient", "Is it too late for me to stop?", "ئایا بۆ وازهێنانم درەنگە؟", "هل
